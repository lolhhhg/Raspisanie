name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: echo "vk.token=${{ secrets.VK_TOKEN }}" > local.properties
      - run: gradle testDebugUnitTest assembleRelease assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle connectedDebugAndroidTest --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.yourdomain.scheduleapp/.MainActivity
            sleep 2
            adb shell screencap -p /sdcard/screen.png
            adb pull /sdcard/screen.png screen.png
      - name: Collect verification tools
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: Raspisanie-APK
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            signing-tools/
            screen.png
            app/build/reports/tests/
            app/build/reports/androidTests/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failures
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
